name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check publication contents
        run: python tools/check_repository.py
      - name: Run offline tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m unittest discover -s tests -v 2>&1 | Tee-Object test-results/unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-python-${{ matrix.python }}
          path: test-results/
          retention-days: 14

  package:
    name: Package and smoke
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tools
        run: python -m pip install ".[dev]"
      - name: Build and audit wheel and sdist
        shell: pwsh
        run: |
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = Get-ChildItem dist -File | ForEach-Object FullName
          python tools/check_repository.py @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install wheel and verify outside checkout
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean maliang.spec
      - name: Collect licenses and smoke EXE
        shell: pwsh
        run: |
          python tools/collect_licenses.py dist/Maliang/THIRD_PARTY_LICENSES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE,docs/third-party.md dist/Maliang/
          $exe = (Resolve-Path dist/Maliang/Maliang.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke' -WorkingDirectory $env:TEMP -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'EXE smoke timed out' }
          if ($process.ExitCode -ne 0) { throw "EXE exit $($process.ExitCode)" }
          Compress-Archive -Path dist/Maliang -DestinationPath dist/Maliang-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Maliang-windows-x64
          path: dist/Maliang-windows-x64.zip
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Maliang-python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
