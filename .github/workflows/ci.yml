name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,agent]"
      - name: Check publication contents
        run: python tools/check_repository.py
      - name: Run offline tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python tools/run_tests.py 2>&1 | Tee-Object test-results/unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit all built-in glyphs and font metrics
        run: python tools/check_builtin_fonts.py
      - name: Keep test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-python-${{ matrix.python }}
          path: test-results/
          retention-days: 14

  package:
    name: Package and smoke
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tools
        run: python -m pip install ".[dev,agent]"
      - name: Build and audit wheel and sdist
        shell: pwsh
        run: |
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = Get-ChildItem dist -File | ForEach-Object FullName
          python tools/check_repository.py @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install wheel and verify outside checkout
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_agent_install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean maliang.spec
      - name: Collect licenses and smoke EXE
        shell: pwsh
        run: |
          python tools/collect_licenses.py dist/Maliang/THIRD_PARTY_LICENSES --agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE,docs/third-party.md dist/Maliang/
          $exe = (Resolve-Path dist/Maliang/Maliang.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke' -WorkingDirectory $env:TEMP -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'EXE smoke timed out' }
          if ($process.ExitCode -ne 0) { throw "EXE exit $($process.ExitCode)" }
          python tools/check_agent_install.py --agent-exe dist/Maliang/MaliangAgent.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/Maliang -DestinationPath dist/Maliang-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Maliang-windows-x64
          path: dist/Maliang-windows-x64.zip
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Maliang-python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
