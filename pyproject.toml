[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "maliang"
dynamic = ["version"]
description = "Visual page annotation and direct USB pen-plotter writing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "hjk41"}]
dependencies = ["PySide6_Essentials==6.12.0", "pyserial==3.5", "numpy==2.5.4", "jsonschema>=4.26.0,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Editors",
]

[project.optional-dependencies]
dev = ["Pillow>=13,<14", "fonttools>=4.67.0,<5", "build>=1.6.1,<2", "PyInstaller>=6.22.3,<7"]
fontbuild = ["Pillow==13.0.0", "fonttools==4.67.0", "opencv-contrib-python-headless==5.0.0.93", "scikit-image==0.26.0"]
agent = ["mcp>=2.3,<3"]

[project.scripts]
maliang-agent = "pagewriter.interfaces.cli:main"

[project.gui-scripts]
maliang = "pagewriter.app:main"

[project.urls]
Homepage = "https://github.com/hjk41/Maliang"
Issues = "https://github.com/hjk41/Maliang/issues"

[tool.setuptools.packages.find]
include = ["pagewriter*"]

[tool.setuptools.dynamic]
version = {attr = "pagewriter.__version__"}

[tool.setuptools.package-data]
pagewriter = ["resources/*.png", "resources/*.ico", "resources/samples/*.pagewriter", "resources/fonts/*.json", "resources/fonts/*.mlfont", "resources/fonts/*.ttf", "resources/fonts/*-LICENSE.txt", "resources/fonts/ARPHICPL.TXT"]
