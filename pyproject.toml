[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "maliang"
dynamic = ["version"]
description = "Visual page annotation and direct USB pen-plotter writing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "hjk41"}]
dependencies = ["PySide6==6.12.0", "pyserial==3.5", "numpy==2.5.4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Editors",
]

[project.optional-dependencies]
dev = ["Pillow>=13.0.0,<14", "build>=1.6.1,<2", "PyInstaller>=6.22.3,<7"]

[project.gui-scripts]
maliang = "pagewriter.app:main"

[project.urls]
Homepage = "https://github.com/hjk41/Maliang"
Issues = "https://github.com/hjk41/Maliang/issues"

[tool.setuptools.packages.find]
include = ["pagewriter*"]

[tool.setuptools.dynamic]
version = {attr = "pagewriter.__version__"}

[tool.setuptools.package-data]
pagewriter = ["resources/*.png", "resources/*.ico", "resources/samples/*.pagewriter"]
